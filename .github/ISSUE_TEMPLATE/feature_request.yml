name: Feature request
description: Suggest something new for the viewer or the generator
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do that isn't possible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: If you have one in mind. Sketches/examples welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
