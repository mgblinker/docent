name: 'processity-documentation-uat'
services:
  processity-documentation:
    build:
      context: ../../
      dockerfile: .docker/Dockerfile
    image: processity-documentation:latest-uat
    container_name: processity-documentation-uat
    ports:
      - "5070:3100"
    networks:
      - processity-network

networks:
  processity-network:
    driver: bridge
    external: true
