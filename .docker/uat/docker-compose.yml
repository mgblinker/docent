name: 'processity-documentation-uat'
services:
  processity-documentation:
    build:
      context: ../../
      dockerfile: .docker/Dockerfile
    image: 192.168.178.40:10006/processity/processity-docs:latest-uat
    container_name: processity-documentation-uat
    environment:
      - AUTH_JWKS_ENDPOINT=http://processity-authentication-service-uat/.well-known/jwks.json
    ports:
      - "5070:3100"
    networks:
      - processity-network

networks:
  processity-network:
    driver: bridge
    external: true
